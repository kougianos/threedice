spring:
  application:
    name: threedice

  datasource:
    url: jdbc:postgresql://localhost:5432/threedice
    username: threedice
    password: threedice
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Game configuration
game:
  initial-balance: 1000.00

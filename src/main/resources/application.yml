spring:
  application:
    name: threedice

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/threedice}
    username: ${SPRING_DATASOURCE_USERNAME:threedice}
    password: ${SPRING_DATASOURCE_PASSWORD:threedice}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# Game configuration
game:
  initial-balance: ${GAME_INITIAL_BALANCE:1000.00}

services:
  postgres:
    image: postgres:16-alpine
    container_name: threedice-db
    environment:
      POSTGRES_DB: threedice
      POSTGRES_USER: threedice
      POSTGRES_PASSWORD: threedice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates threedice_go on first boot. See the script for existing volumes.
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U threedice -d threedice" ]
      interval: 5s
      timeout: 5s
      retries: 10

  spring-boot:
    build: ./spring-boot
    container_name: threedice-spring
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/threedice
      SPRING_DATASOURCE_USERNAME: threedice
      SPRING_DATASOURCE_PASSWORD: threedice
    ports:
      - "8080:8080"

  go:
    build: ./go
    container_name: threedice-go
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://threedice:threedice@postgres:5432/threedice_go?sslmode=disable
      PORT: "8081"
    ports:
      - "8081:8081"

volumes:
  pgdata:

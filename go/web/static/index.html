<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeDice</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🎲 ThreeDice</h1>
            <div id="player-info" class="player-info">
                <span class="player-name" id="player-name">-</span>
                <span class="player-balance" id="player-balance">$0.00</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Bet Section -->
        <section class="card bet-card">
            <h2>Place Your Bet</h2>
            <form id="bet-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="stake">Stake ($)</label>
                        <input type="text" inputmode="decimal" id="stake" placeholder="10.00" value="10.00" required>
                        <div class="quick-stakes">
                            <button type="button" class="stake-btn" data-amount="10">+$10</button>
                            <button type="button" class="stake-btn" data-amount="100">+$100</button>
                            <button type="button" class="stake-btn" data-amount="250">+$250</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="predicted-value">Predicted Product (1–216)</label>
                        <input type="text" inputmode="numeric" id="predicted-value" placeholder="12" value="12" required>
                        <div class="quick-picks">
                            <button type="button" class="pick-btn" data-value="6" title="4.2% chance - 5x payout">6 <small>4.2%</small></button>
                            <button type="button" class="pick-btn best" data-value="12" title="6.9% chance - 5x payout (best odds!)">12 <small>6.9%⭐</small></button>
                            <button type="button" class="pick-btn" data-value="24" title="5.6% chance - 5x payout">24 <small>5.6%</small></button>
                            <button type="button" class="pick-btn" data-value="36" title="5.1% chance - 5x payout">36 <small>5.1%</small></button>
                            <button type="button" class="pick-btn" data-value="8" title="3.2% chance - 2x payout">8 <small>3.2%</small></button>
                            <button type="button" class="pick-btn" data-value="30" title="2.8% chance - 5x payout">30 <small>2.8%</small></button>
                            <button type="button" class="pick-btn" data-value="60" title="3.7% chance - 5x payout">60 <small>3.7%</small></button>
                            <button type="button" class="pick-btn" data-value="120" title="2.8% chance - 2x payout">120 <small>2.8%</small></button>
                        </div>
                    </div>
                </div>

                <button type="submit" id="bet-btn" class="btn btn-primary">Roll the Dice!</button>
            </form>

            <div class="odds-hint">
                <strong>Odds:</strong>
                Product &lt; 9 → <span class="odds-badge">2x</span> &nbsp;|&nbsp;
                9–119 → <span class="odds-badge highlight">5x</span> &nbsp;|&nbsp;
                120–216 → <span class="odds-badge">2x</span>
            </div>
        </section>

        <!-- Result Section (hidden until first bet) -->
        <section class="card result-card hidden" id="result-section">
            <h2>Last Result</h2>
            <div class="dice-display">
                <div class="die" id="die1">?</div>
                <div class="multiply">×</div>
                <div class="die" id="die2">?</div>
                <div class="multiply">×</div>
                <div class="die" id="die3">?</div>
                <div class="equals">=</div>
                <div class="product" id="product-value">?</div>
            </div>
            <div class="result-details">
                <span class="result-status" id="result-status">-</span>
                <span class="result-winnings" id="result-winnings"></span>
            </div>
        </section>

        <!-- History Tabs -->
        <section class="card history-card">
            <div class="tabs">
                <button class="tab active" data-tab="bets">Bet History</button>
                <button class="tab" data-tab="transactions">Transactions</button>
            </div>

            <div class="tab-content active" id="tab-bets">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Predicted</th>
                            <th>Dice</th>
                            <th>Product</th>
                            <th>Stake</th>
                            <th>Result</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="bet-history-body">
                        <tr><td colspan="7" class="empty-row">No bets yet. Place your first bet above!</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="tab-content" id="tab-transactions">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Balance After</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="txn-history-body">
                        <tr><td colspan="5" class="empty-row">No transactions yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>ThreeDice - A Coding Challenge</p>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>

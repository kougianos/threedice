# Coolify deployment for the Go service (the flavour running in production).
#
# This is NOT the local-development stack — that lives at ../docker-compose.yml
# in the repository root and also runs PostgreSQL and the Spring service. This
# file builds and runs only the Go binary and talks to an external,
# Coolify-managed PostgreSQL via DATABASE_URL.
#
# Coolify — Build Pack: Docker Compose
#   Base Directory:          /go
#   Docker Compose Location: /docker-compose.yml
#
# The service key below ("threedice-go") is what Coolify names the container and
# image after, so the service shows up as "threedice-go" on Beszel instead of a
# random UUID. Enable Configuration > Advanced > "Consistent Container Names" to
# also drop the trailing UUID and get exactly "threedice-go".
#
# The domain is assigned to this service in the Coolify UI (the service's Domains
# field), as https://<your-domain>:8081 — the :8081 tells Coolify which container
# port to route to; the public URL stays on 80/443. A custom domain is a UI
# setting, not a SERVICE_FQDN_* variable: those are only for Coolify's
# auto-generated wildcard subdomains, and mixing the two produces a duplicate
# domain and an extra TLS certificate.
services:
  threedice-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: threedice-go:latest
    restart: unless-stopped
    environment:
      - PORT=8081
      - DATABASE_URL=${DATABASE_URL}
      - INITIAL_BALANCE=${INITIAL_BALANCE:-1000.00}
    expose:
      - "8081"
